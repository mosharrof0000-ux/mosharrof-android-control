name: Deploy Cloudflare Relay

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare/worker/**"
      - ".github/workflows/deploy-cloudflare-relay.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify required secrets are configured
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONNECTOR_TOKEN: ${{ secrets.CHATGPT_CONNECTOR_TOKEN }}
          DEVICE_SETUP_TOKEN: ${{ secrets.DEVICE_SETUP_TOKEN }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CONNECTOR_TOKEN" || { echo "::error::Missing CHATGPT_CONNECTOR_TOKEN"; exit 1; }
          test -n "$DEVICE_SETUP_TOKEN" || { echo "::error::Missing DEVICE_SETUP_TOKEN"; exit 1; }
      - name: Install and type-check
        working-directory: cloudflare/worker
        run: |
          npm install
          npm run check
      - name: Configure Wrangler credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Cloudflare account credentials loaded (values hidden)."
      - name: Set Worker secrets
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHATGPT_CONNECTOR_TOKEN: ${{ secrets.CHATGPT_CONNECTOR_TOKEN }}
          DEVICE_SETUP_TOKEN: ${{ secrets.DEVICE_SETUP_TOKEN }}
        run: |
          printf '%s' "$CHATGPT_CONNECTOR_TOKEN" | npx wrangler secret put CHATGPT_CONNECTOR_TOKEN
          printf '%s' "$DEVICE_SETUP_TOKEN" | npx wrangler secret put DEVICE_SETUP_TOKEN
      - name: Deploy Worker and Durable Object
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
