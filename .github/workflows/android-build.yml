name: Android build

on:
  push:
    branches: [main, "work/**"]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
      - "tools/**"

  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
      - "tools/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.6"

      # Strict mode consumes the committed lock state and SHA-256 verification
      # metadata. It must not rewrite or bootstrap dependency state in CI.
      - name: Verify committed dependency locks and checksums
        run: |
          test -s android/app/gradle.lockfile
          test -s android/buildscript-gradle.lockfile
          test -s android/gradle/verification-metadata.xml
          gradle -p android --dependency-verification=strict :app:testDebugUnitTest :app:cyclonedxDirectBom :app:assembleDebug
          git diff --exit-code -- android/app/gradle.lockfile android/buildscript-gradle.lockfile android/gradle/verification-metadata.xml

      - name: Capture dependency paths for OSV triage
        run: |
          mkdir -p android/build/reports/dependency-triage
          gradle -p android --dependency-verification=strict :app:dependencies > android/build/reports/dependency-triage/app-dependencies.txt
          gradle -p android --dependency-verification=strict buildEnvironment > android/build/reports/dependency-triage/root-build-environment.txt
          gradle -p android --dependency-verification=strict :app:buildEnvironment > android/build/reports/dependency-triage/app-build-environment.txt

      - name: Generate Android CycloneDX SBOM
        run: gradle -p android --dependency-verification=strict :app:cyclonedxDirectBom

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test license and notice audit tools
        run: |
          python3 -m unittest discover -s tools -p 'test_audit_binary_notices.py' -v
          python3 -m unittest discover -s tools -p 'test_audit_maven_metadata.py' -v

      - name: Audit upstream Maven POM license and source metadata
        run: |
          python3 tools/audit_maven_metadata.py --sbom android/app/build/reports/cyclonedx-direct/bom.json --json-report android/build/reports/license-review/maven-metadata-audit.json --markdown-report android/build/reports/license-review/MAVEN_METADATA_AUDIT.md --attributions android/app/src/main/assets/POM_THIRD_PARTY_ATTRIBUTIONS.txt

      - name: Build license inventory and enrich reviewed SBOM metadata
        run: |
          python3 tools/audit_sbom_licenses.py \
            --sbom android/app/build/reports/cyclonedx-direct/bom.json \
            --reviewed-sbom android/build/reports/license-review/bom-reviewed.json \
            --report android/build/reports/license-review/THIRD_PARTY_LICENSE_REVIEW.md \
            --app-notices android/app/src/main/assets/THIRD_PARTY_NOTICES.md

      - name: Collect resolved release runtime AAR/JAR artifacts
        run: |
          gradle -p android --dependency-verification=strict \
            --init-script "$GITHUB_WORKSPACE/tools/collect_runtime_artifacts.init.gradle" \
            :app:collectReleaseRuntimeArtifacts
          test -d android/app/build/reports/license-review/runtime-artifacts

      - name: Audit binary-level licenses and preserve upstream notices
        run: |
          python3 tools/audit_binary_notices.py \
            --sbom android/app/build/reports/cyclonedx-direct/bom.json \
            --artifact-dir android/app/build/reports/license-review/runtime-artifacts \
            --notice-output android/app/src/main/assets/UPSTREAM_THIRD_PARTY_NOTICES.txt \
            --json-report android/build/reports/license-review/binary-notice-audit.json \
            --markdown-report android/build/reports/license-review/BINARY_NOTICE_AUDIT.md

      - name: Package Apache License 2.0 text for runtime dependencies
        run: |
          mkdir -p android/app/src/main/assets/licenses
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://www.apache.org/licenses/LICENSE-2.0.txt \
            --output android/app/src/main/assets/licenses/Apache-2.0.txt
          grep -q "Apache License" android/app/src/main/assets/licenses/Apache-2.0.txt
          grep -q "Version 2.0" android/app/src/main/assets/licenses/Apache-2.0.txt


      - name: Assemble debug APK
        run: gradle -p android --dependency-verification=strict :app:assembleDebug

      - name: Verify APK packages generated license inventory and declared license text
        run: |
          python3 - <<'PY'
          import zipfile
          apk = "android/app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              required = {
                  "assets/THIRD_PARTY_NOTICES.md",
                  "assets/UPSTREAM_THIRD_PARTY_NOTICES.txt",
                  "assets/licenses/Apache-2.0.txt",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"APK is missing required notice assets: {missing}")
              license_text = archive.read("assets/licenses/Apache-2.0.txt").decode("utf-8")
              notices = archive.read("assets/THIRD_PARTY_NOTICES.md").decode("utf-8")
              upstream = archive.read("assets/UPSTREAM_THIRD_PARTY_NOTICES.txt").decode("utf-8")
              if "Version 2.0" not in license_text or "appauth" not in notices or not upstream.strip():
                  raise SystemExit("APK license inventory/full-text content validation failed")
          import json
          audit = json.load(open("android/build/reports/license-review/binary-notice-audit.json", encoding="utf-8"))
          if audit["component_count"] == 0 or audit["binary_component_count"] != audit["component_count"] or audit["failures"]:
              raise SystemExit("Binary notice audit did not cover every SBOM component")
          print(f"APK contains generated license inventory and Apache-2.0 text; inspected {audit['binary_component_count']} runtime components; extracted archive notices for {audit['archive_notice_component_count']}.")
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-android-control-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload generated Gradle dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-dependency-evidence
          path: |
            android/app/gradle.lockfile
            android/buildscript-gradle.lockfile
            android/gradle/verification-metadata.xml
            android/app/build/reports/cyclonedx-direct/bom.json
            android/build/reports/license-review/**
            android/app/src/main/assets/UPSTREAM_THIRD_PARTY_NOTICES.txt
            android/app/src/main/assets/POM_THIRD_PARTY_ATTRIBUTIONS.txt
            android/build/reports/license-review/maven-metadata-audit.json
            android/build/reports/license-review/MAVEN_METADATA_AUDIT.md
            android/build/reports/dependency-triage/**
          if-no-files-found: error

  dependency-scan:
    needs: assemble
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      download-artifact: android-gradle-dependency-evidence
      scan-args: |-
        --lockfile=app/gradle.lockfile
        --lockfile=buildscript-gradle.lockfile
        --lockfile=gradle/verification-metadata.xml
      fail-on-vuln: false
