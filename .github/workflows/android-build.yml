name: Android build

on:
  push:
    branches: [main, "work/**"]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.6"

      - name: Generate dependency locks and verification metadata
        run: gradle -p android :app:testDebugUnitTest :app:cyclonedxDirectBom :app:assembleDebug --write-locks --write-verification-metadata sha256

      - name: Capture dependency paths for OSV triage
        run: |
          mkdir -p android/build/reports/dependency-triage
          # Capture all app configurations instead of hard-coding AGP-internal
          # configuration names that can disappear between AGP releases.
          gradle -p android :app:dependencies > android/build/reports/dependency-triage/app-dependencies.txt
          gradle -p android buildEnvironment > android/build/reports/dependency-triage/root-build-environment.txt
          gradle -p android :app:buildEnvironment > android/build/reports/dependency-triage/app-build-environment.txt

      - name: Run Android unit tests
        run: gradle -p android :app:testDebugUnitTest

      - name: Generate Android CycloneDX SBOM
        run: gradle -p android :app:cyclonedxDirectBom

      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-android-control-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload generated Gradle dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-dependency-evidence
          path: |
            android/app/gradle.lockfile
            android/buildscript-gradle.lockfile
            android/gradle/verification-metadata.xml
            android/app/build/reports/cyclonedx-direct/bom.json
            android/build/reports/dependency-triage/**
          if-no-files-found: error

  dependency-scan:
    needs: assemble
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      download-artifact: android-gradle-dependency-evidence
      scan-args: |-
        --lockfile=app/gradle.lockfile
        --lockfile=gradle/verification-metadata.xml
      # Inventory-only first pass: publish findings for review before making
      # vulnerability presence a release-blocking policy.
      fail-on-vuln: false
