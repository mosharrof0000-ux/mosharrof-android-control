name: Android Companion Build

on:
  # Retained only for the older relay feature branch. Pull requests and main
  # are handled by the canonical Android build workflow to avoid duplicate APK builds.
  push:
    branches: [feat/cloudflare-chatgpt-relay-20261102]
    paths:
      - "android/**"
      - ".github/workflows/android-companion-build.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        working-directory: android
        run: gradle :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-companion-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
