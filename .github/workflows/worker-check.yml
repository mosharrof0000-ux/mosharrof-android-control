name: Cloudflare Worker Check

on:
  pull_request:
    paths:
      - "cloudflare/worker/**"
      - ".github/workflows/worker-check.yml"
  push:
    branches: [main, feat/cloudflare-chatgpt-relay-20261102]
    paths:
      - "cloudflare/worker/**"
      - ".github/workflows/worker-check.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate npm lockfile from declared dependencies
        working-directory: cloudflare/worker
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact locked dependencies
        working-directory: cloudflare/worker
        run: npm ci
      - name: Audit resolved dependencies
        working-directory: cloudflare/worker
        run: npm audit --audit-level=high
      - name: Generate CycloneDX SBOM
        working-directory: cloudflare/worker
        run: npm sbom --sbom-format=cyclonedx > worker-sbom.cdx.json
      - name: Type-check and test
        working-directory: cloudflare/worker
        run: npm run check
      - name: Upload generated dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: worker-dependency-evidence
          path: |
            cloudflare/worker/package-lock.json
            cloudflare/worker/worker-sbom.cdx.json
          if-no-files-found: error
